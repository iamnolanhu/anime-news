# Shot Director on deploy-host: https://your-site.example (Traefik + Let's Encrypt resolver `le`).
# Run from /root/shot-director:  docker compose -f app/deploy/compose.yml -p shot-director up -d --build
# DNS FIRST: the A record must resolve before the container starts, or Traefik's cert order fails
# and is not retried (fix: docker restart traefik-traefik-1). See deploy/README.md.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shot-director:latest
    container_name: shot-director
    restart: unless-stopped
    env_file:
      - /root/shot-director/.env   # COMFY_API_KEY, SHOT_DIRECTOR_ACCESS_TOKEN, SHOT_DIRECTOR_PUBLIC_URL
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    volumes:
      - media:/data/media
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.shot-director-http.entrypoints=http
      - traefik.http.routers.shot-director-http.rule=Host(`your-site.example`)
      - traefik.http.routers.shot-director-http.middlewares=https-redirect@file
      - traefik.http.routers.shot-director-https.entrypoints=https
      - traefik.http.routers.shot-director-https.rule=Host(`your-site.example`)
      - traefik.http.routers.shot-director-https.tls=true
      - traefik.http.routers.shot-director-https.tls.certresolver=le
      - traefik.http.services.shot-director.loadbalancer.server.port=8000

volumes:
  media:
    name: shot-director-media

networks:
  traefik-public:
    external: true
