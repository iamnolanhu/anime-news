[project]
name = "anime-news"
version = "0.1.0"
description = "Anime News: a headline in, an anime news episode out (storyboard, FLUX stills, Seedance shots, anime cut) via the Comfy Router. Engine formerly Shot Director."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
shot-director = "shot_director.app:main"
shot-director-episode = "shot_director.episode:main"
shot-director-cut = "shot_director.edit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shot_director"]
