<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime News: local engine</title>
<style>
  :root { --bg:#000000; --panel:#0d0d0d; --line:rgba(255,255,255,.10); --text:#ffffff; --dim:#a3a3a3; --accent:#F5C518; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .badge.mock { color:#ffd27a; border-color:#6b5420; }
  .badge.live { color:#7ee2a8; border-color:#1f6b42; }
  main { max-width:1100px; margin:0 auto; padding:18px 22px 60px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  label { display:block; font-size:13px; color:var(--dim); margin:8px 0 4px; }
  select, input[type=text], input[type=password], input[type=number], textarea { width:100%; background:#000; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .row > * { flex:1 1 160px; }
  .row > .tight { flex:0 0 auto; }
  button { font:inherit; }
  button.primary { padding:10px 16px; border:0; border-radius:9px; background:var(--accent); color:#000; font-weight:700; cursor:pointer; }
  button.ghost { padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); cursor:pointer; }
  button.danger { color:var(--err); }
  button:disabled { opacity:.5; cursor:wait; }
  .hint { font-size:12px; color:var(--dim); }
  #status { font-size:13px; color:var(--dim); min-height:1.4em; }
  #status.err { color:var(--err); }
  .scene { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:12px 0; }
  .scene-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .scene-head strong { color:var(--accent); }
  .shots { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:10px; margin-top:10px; }
  .shot { border:1px solid var(--line); border-radius:8px; padding:8px; background:#000; }
  .shot.talk { border-color:rgba(245,197,24,.45); }
  .shot .tools { display:flex; gap:4px; justify-content:flex-end; margin-top:6px; }
  .shot textarea { min-height:70px; font-size:13px; }
  .progress { height:10px; background:#000; border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:8px; }
  .progress > div { height:100%; width:0; background:var(--accent); transition:width .4s; }
  video { width:100%; max-height:60vh; background:#000; border-radius:10px; margin-top:10px; }
  .eps { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .ep video { margin-top:0; }
  .ep .meta { font-size:12px; color:var(--dim); }
  a { color:var(--accent); }
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/public.css">
<script src="/static/access.js"></script>
<script src="/static/vendor/anime.min.js" defer></script>
<script src="/static/theme.js" defer></script>
</head>
<body>
<canvas id="fx-particles" aria-hidden="true"></canvas>
<header>
  <a class="an-lockup" href="/" aria-label="Anime News home"><span class="an-mark-wrap"><svg xmlns="http://www.w3.org/2000/svg" class="an-mark" viewBox="110 110 1280 1280" aria-hidden="true" focusable="false"><defs><path id="an-face-left" pathLength="1" d="M232 574 L545 390 L863 572 L557 754 L557 1136 L232 951"/><path id="an-face-top" pathLength="1" d="M614 347 L921 165 L1252 352 L1253 1082 L934 887 L933 527 Z"/><path id="an-face-base" pathLength="1" d="M617 792 L1238 1159 L923 1346 L617 1173 Z"/><linearGradient id="an-gold" gradientUnits="userSpaceOnUse" x1="0" y1="165" x2="0" y2="1346"><stop offset="0" stop-color="#FFE566"/><stop offset=".45" stop-color="#F5C518"/><stop offset="1" stop-color="#C99700"/></linearGradient><pattern id="an-scan" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="8" fill="#F5C518"/></pattern><filter id="an-blur" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="22"/></filter></defs><g class="an-scanfill" fill="url(#an-scan)" stroke="none" opacity=".16"><use href="#an-face-left"/><use href="#an-face-top"/><use href="#an-face-base"/></g><g class="an-glow" fill="none" stroke="#FFE566" stroke-width="52" stroke-linejoin="miter" filter="url(#an-blur)" opacity=".55"><use class="an-draw" href="#an-face-left"/><use class="an-draw" href="#an-face-top"/><use class="an-draw" href="#an-face-base"/></g><g class="an-chroma" fill="none" stroke-width="26" stroke-linejoin="miter" opacity=".25"><g transform="translate(-10 0)" stroke="#19E6FF"><use class="an-draw" href="#an-face-left"/><use class="an-draw" href="#an-face-top"/><use class="an-draw" href="#an-face-base"/></g><g transform="translate(10 0)" stroke="#FF2BD6"><use class="an-draw" href="#an-face-left"/><use class="an-draw" href="#an-face-top"/><use class="an-draw" href="#an-face-base"/></g></g><g class="an-stroke" fill="none" stroke="url(#an-gold)" stroke-width="26" stroke-linejoin="miter"><use class="an-draw" href="#an-face-left"/><use class="an-draw" href="#an-face-top"/><use class="an-draw" href="#an-face-base"/></g></svg></span><h1 class="wordmark">Anime News</h1></a>
  <span id="mode" class="badge">...</span>
  <a class="nav-link" href="/episodes">Episodes</a>
  <span id="access" class="badge access" hidden></span>
  <span style="flex:1"></span>
  <span id="status" role="status"></span>
</header>
<main>
  <section id="keyPanel">
    <h2>1. Comfy API key</h2>
    <div class="row">
      <div><label for="key">Stored on this machine only (~/.anime-news/config.json). Without a key the engine renders offline placeholders.</label>
        <input id="key" type="password" autocomplete="off" placeholder="paste your Comfy API key"></div>
      <div class="tight"><button class="ghost" id="saveKey">Save key</button> <button class="ghost danger" id="clearKey">Clear</button></div>
    </div>
    <div class="hint" id="keyState"></div>
  </section>

  <section>
    <h2>2. Headline</h2>
    <label for="headline">Headline</label>
    <input id="headline" type="text" maxlength="300" placeholder="Ancient Rome's senate switches to a 4-day week">
    <label for="text">Article text or a link (optional)</label>
    <textarea id="text" placeholder="Paste the article, some notes, or a URL to fetch"></textarea>
    <div class="row">
      <div><label for="minutes">Length (minutes)</label><input id="minutes" type="number" min="0.5" max="5" step="0.5" value="1"></div>
      <div><label for="style">Style direction (optional)</label><input id="style" type="text" placeholder="e.g. rainy neon night, more kaiju"></div>
      <div class="tight"><button class="primary" id="write">Write storyboard</button></div>
    </div>
  </section>

  <section id="sbPanel" hidden>
    <h2>3. Storyboard <span class="hint" id="sbStats"></span></h2>
    <div class="hint">Edit anything. Add, delete or reorder scenes and shots; there is no shot limit. Every shot gets its own start frame, and the cut never shows a moment twice.</div>
    <label for="logline">Logline</label><input id="logline" type="text">
    <div id="scenes"></div>
    <div class="row"><div class="tight"><button class="ghost" id="addScene">+ Scene</button> <button class="ghost" id="rewrite">Regenerate storyboard</button></div></div>
  </section>

  <section id="renderPanel" hidden>
    <h2>4. Render</h2>
    <div class="row">
      <div><label for="quality">Quality</label><select id="quality"><option value="480p">480p (cheaper)</option><option value="720p">720p</option></select></div>
      <div><label><input id="vertical" type="checkbox"> Also export 9:16</label></div>
      <div class="tight"><button class="primary" id="render">Render episode</button> <button class="ghost danger" id="cancel" hidden>Cancel</button></div>
    </div>
    <div class="hint" id="jobState"></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="result"></div>
  </section>

  <section>
    <h2>Episodes</h2>
    <div class="eps" id="episodes"></div>
    <div class="hint" id="noEps" hidden>No finished episodes yet.</div>
  </section>
</main>
<script src="/static/studio.js"></script>
</body>
</html>
