  button.primary { padding:11px; border:0; border-radius:9px; background:var(--accent); color:#1a1205; font-weight:700; cursor:pointer; font-size:15px; }
  button.ghost { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { font-size:13px; color:var(--dim); min-height:1.4em; }
  #status.err { color:#ff8a8a; }
  a { color:var(--accent); }
  .empty { padding:18px 22px; color:var(--dim); }

<div class="gallery-head">
  <p>The Hourly Briefing: each episode starts from a real trending headline and is written, drawn, animated, cut and scored on Comfy Router. Newest first.</p>
  <button class="primary" id="render">Render the next episode</button>
</div>
<main id="episodes" class="gallery" aria-live="polite"></main>
<div id="empty" class="empty" hidden>No finished episodes yet.</div>
<footer class="site-foot">Anime News · open source · #OpenSourceHiggsfield · MIT · <a id="repo-link" href="#">repo link coming soon</a> · <a href="/">Studio</a></footer>
<script>
const $ = (id) => document.getElementById(id);
const track = (name, props) => window.access.track(name, props);
function status(msg, err = false) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }
const when = (iso) => { try { return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso || ""; } };
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let polling = null;

function card(ep) {
  const c = el("article", "ep");
  if (ep.status === "rendering") {
    c.classList.add("rendering");
    c.appendChild(el("h3", null, ep.headline || ep.headline_raw || "Next episode"));
    c.appendChild(el("div", "meta", `Rendering now (started ${when(ep.created)}). Episodes take about 10 minutes.`));
    return c;
  }
  const v = document.createElement("video");
  v.src = ep.url; v.controls = true; v.preload = "metadata"; v.playsInline = true;
  let played = false;
  v.addEventListener("play", () => {
    if (played) return;
    played = true;
    track("episode_played", { episode_id: ep.id, file: ep.file, headline: ep.headline, engine: ep.engine });
  });
  c.appendChild(v);
  const h = el("h3");
  if (ep.link) { const a = el("a", null, ep.headline || ep.headline_raw); a.href = ep.link; a.target = "_blank"; a.rel = "noopener"; h.appendChild(a); }
  else h.textContent = ep.headline || ep.headline_raw;
  c.appendChild(h);
  if (ep.logline) c.appendChild(el("p", "logline", ep.logline));
  const cut = ep.cut || {};
  const bits = [when(ep.finished || ep.created), ep.source,
    cut.duration ? `${Math.round(cut.duration)} s` : null, cut.shots ? `${cut.shots} shots` : null,
    ep.engine, ep.seconds_to_render ? `rendered in ${Math.round(ep.seconds_to_render / 60)} min` : null].filter(Boolean);
  c.appendChild(el("div", "meta", bits.join(" · ")));
  return c;
}

async function load() {
  const j = await (await fetch("/api/episodes")).json();
  const list = (j.episodes || []).filter((e) => (e.status === "done" && e.url) || e.status === "rendering");
  list.sort((a, b) => String(b.finished || b.created || "").localeCompare(String(a.finished || a.created || "")));
  const root = $("episodes");
  root.replaceChildren(...list.map(card));
  $("empty").hidden = list.length > 0;
  const busy = list.some((e) => e.status === "rendering");
  if (busy && !polling) polling = setInterval(() => load().catch(() => {}), 20000);
  if (!busy && polling) { clearInterval(polling); polling = null; }
}

$("render").onclick = async () => {
  const btn = $("render");
  btn.disabled = true;
  status("Requesting an episode (about 10 minutes when live)...");
  track("episode_requested", { from: "gallery" });
  try {
    const started = Date.now();
    setTimeout(() => load().catch(() => {}), 3000);
    const r = await window.access.fetch("/api/episode", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || j.detail || r.statusText);
    const cut = j.cut || {};
    track("episode_rendered", { duration_s: cut.duration || null, shots: cut.shots || (j.shots || []).length,
      engine: ((j.shots || [])[0] || {}).engine || null, seconds: Math.round((Date.now() - started) / 1000) });
    status("Episode ready.");
  } catch (e) {
    status(e.message, true);
  } finally {
    btn.disabled = false;
    load().catch(() => {});
  }
};

load().catch((e) => status(e.message, true));
</script>
